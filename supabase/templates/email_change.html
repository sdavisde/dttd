<html>
  <body>
    <h2>Confirm your email change</h2>
    <p>
      A request was made to change your Dusty Trails Tres Dias account email
      from {{ .Email }} to {{ .NewEmail }}.
    </p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/profile"
        >Confirm this email change</a
      >
    </p>
    <p>
      If you did not request this change, you can safely ignore this email and
      your account email will stay the same.
    </p>
  </body>
</html>
